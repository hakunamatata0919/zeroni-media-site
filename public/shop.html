<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>购买渠道 - ZERONI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h2>购买渠道</h2>
    <a href="/">返回</a>
    <button id="accountBtn" class="account-btn">登录/注册</button>
  </header>
  <main class="shop-page">
    <section class="shop-card">
      <h3>国内官方授权渠道 A</h3>
      <p>官方正版周边、授权服饰及限定礼盒购买入口。</p>
      <a class="shop-btn" href="https://example.com/official-a" target="_blank" rel="noreferrer">前往官方渠道 A</a>
    </section>
    <section class="shop-card">
      <h3>国内官方授权渠道 B</h3>
      <p>官方授权礼品、周边套装与限定商品跳转页面。</p>
      <a class="shop-btn" href="https://example.com/official-b" target="_blank" rel="noreferrer">前往官方渠道 B</a>
    </section>
    <section class="shop-note">
      <p>说明：本页面仅提供授权渠道跳转，无站内商品、无下单、无库存管理。</p>
    </section>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
