<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>首页 - ZERONI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h2>ZERONI 主页</h2>
    <a href="/">返回</a>
    <button id="accountBtn" class="account-btn">登录/注册</button>
  </header>
  <main>
    <div class="layout">
      <section class="main-col">
        <section class="promo-video card">
          <h3>宣传短视频</h3>
          <video controls poster="/assets/poster1.jpg" src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"></video>
        </section>

        <section class="articles">
          <h3>ZERONI 各角色娃娃图文解析</h3>
          <article class="card gallery">
            <h4>角色娃娃设定与亮点</h4>
            <p class="meta">图文解析 · 官方</p>
            <div class="thumbs">
              <img src="/assets/char1.jpg" alt="角色1">
              <img src="/assets/char2.jpg" alt="角色2">
              <img src="/assets/char3.jpg" alt="角色3">
            </div>
            <p>围绕各个角色的造型、性格与互动场景做简要介绍。</p>
          </article>
        </section>

        <section class="articles">
          <h3>ZERONI 最新资讯</h3>
          <article class="card">
            <h4>最新资讯标题</h4>
            <p class="meta">2026-07-10 · 官方</p>
            <p>这里展示最新上线的内容与活动信息。</p>
          </article>
        </section>
      </section>

      <aside class="side-col">
        <div class="auth-box">
          <h4>登录 / 注册</h4>
          <p>点击右上角即可进行最基本的登录与注册。</p>
        </div>
      </aside>
    </div>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
