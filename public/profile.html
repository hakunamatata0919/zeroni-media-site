<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>个人中心 - ZERONI</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h2>个人中心</h2>
    <a href="/">返回</a>
    <button id="logoutBtn" class="account-btn">退出</button>
  </header>
  <main class="profile-page">
    <section class="profile-card">
      <div id="userInfo">加载中...</div>
    </section>
    <section class="profile-card">
      <h3>我的投稿</h3>
      <div id="submissionList">加载中...</div>
    </section>
    <section class="profile-sections">
      <div class="profile-card">
        <h3>个人素材库</h3>
        <p>上传图片、AI作品占位。</p>
      </div>
      <div class="profile-card">
        <h3>我的内容</h3>
        <p>心愿便利贴、回忆日记列表占位。</p>
      </div>
      <div class="profile-card">
        <h3>我的收藏</h3>
        <p>官方音源、图文资讯收藏占位。</p>
      </div>
      <div class="profile-card">
        <h3>账号安全</h3>
        <button id="changePassBtn">修改密码</button>
      </div>
    </section>
  </main>
  <script src="/js/main.js"></script>
</body>
</html>
